# Radar у хмарі: щогодини збирає новини й публікує сторінку на GitHub Pages.
# Видання, теми й параметри — у теці config/radar. Після їх зміни оновлення запускається одразу.
name: Radar

on:
  schedule:
    # Двічі на годину й не на початку години: GitHub відкладає або пропускає запуски за розкладом,
    # особливо о :00–:10, коли його сервери найбільш завантажені
    - cron: "23,53 * * * *"
  workflow_dispatch:            # кнопка «Run workflow» — оновити вручну
  push:
    branches: [main]
    paths: ["config/**", "radar/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # щоб підтримувати розклад увімкненим (див. крок Keep schedule alive)

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Kyiv
      XDG_CONFIG_HOME: ${{ github.workspace }}/config
      XDG_DATA_HOME: ${{ github.workspace }}/.data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # База Radar (що вже бачили, переклади, позначки «важливо») зберігається між запусками
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: .data/radar/radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      # Дані дашборда — окремим кешем, щоб не чіпати кеш бази
      - name: Restore dashboard data
        uses: actions/cache/restore@v4
        with:
          path: .data/radar/dashboard.json
          key: radar-dash-${{ github.run_id }}
          restore-keys: radar-dash-

      - name: Collect news
        run: python3 radar/radar.py run --no-notify

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .data/radar/radar.db
          key: radar-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save dashboard data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .data/radar/dashboard.json
          key: radar-dash-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare page
        run: |
          mkdir -p site
          cp "$XDG_DATA_HOME/radar/report.html" site/index.html
          # Під цією назвою на неї посилається кнопка «← Новини» на дашборді
          cp "$XDG_DATA_HOME/radar/report.html" site/report.html
          # Дашборд (курси, ставка, ринки, крипта); посилання «Дашборд ↗» веде саме сюди
          cp "$XDG_DATA_HOME/radar/dashboard.html" site/dashboard.html || true
          touch site/.nojekyll
          tail -n 20 "$XDG_DATA_HOME/radar/radar.log" || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub вимикає розклад у репозиторії, де 60 днів не було змін. Повторне ввімкнення
      # під час кожного запуску не дає цьому статися.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable radar.yml --repo "$GITHUB_REPOSITORY"
